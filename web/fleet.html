<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0d12" />
<title>AIOps 현황 상황판</title>
<style>
  html{color-scheme:dark;}
  :root{
    --bg:#0a0d12; --bar:#11151c; --bar2:#161b23; --border:#242b35; --text:#e8edf4; --muted:#8a94a3;
    --green:#2f9e44; --green2:#1f7a33; --amber:#d9a441; --red:#d6453d; --gray:#39404a; --accent:#4c8dff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;overflow:hidden;}
  header{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 16px;background:linear-gradient(180deg,#141a22,#0d1118);border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;}
  header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
  header nav,header a[href="/logout"]{white-space:nowrap;}
  #legend{flex-wrap:nowrap;white-space:nowrap;}
  nav a{color:var(--muted);text-decoration:none;font-size:12px;margin-right:6px;padding:4px 10px;border-radius:6px;transition:.15s;}
  nav a.active{color:#fff;background:#222b38;}
  nav a:hover{color:#fff;background:#1a212b;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-left:auto;align-items:center;}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle;}
  #meta{color:var(--muted);font-size:11px;min-width:140px;text-align:right;}
  .seg{display:inline-flex;align-items:center;gap:0;background:#0e131a;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .seg .lab{color:var(--muted);font-size:10px;padding:0 7px;}
  .seg button{background:none;border:none;color:var(--muted);font-size:11px;padding:4px 9px;cursor:pointer;transition:.12s;font-family:inherit;}
  .seg button.on{background:var(--accent);color:#fff;}
  .seg button:hover:not(.on){background:#1a212b;color:#fff;}
  .ctrls{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;}
  nav a,.seg,.ms>button{height:28px;box-sizing:border-box;}
  nav a,.seg button,.ms>button{display:inline-flex;align-items:center;}
  .sep{width:1px;height:20px;background:var(--border);display:inline-block;flex:0 0 auto;}
  .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ms{position:relative;}
  .ms>button{background:#0e131a;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap;}
  .ms>button:hover{background:#1a212b;}
  .ms-menu{position:absolute;top:110%;left:0;z-index:60;min-width:200px;max-height:340px;overflow:auto;
    background:#11161d;border:1px solid var(--border);border-radius:9px;padding:6px;display:none;box-shadow:0 10px 34px rgba(0,0,0,.5);}
  .ms-menu.open{display:block;}
  .ms-menu label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .ms-menu label:hover{background:#1a212b;}
  .ms-menu input{accent-color:var(--accent);}
  .ms-menu .div{height:1px;background:var(--border);margin:5px 2px;}
  .ms-menu .grp{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 8px 2px;}
  .btn-an{background:linear-gradient(180deg,#3b7bff,#2f6ae0);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:6px;transition:.15s;}
  .btn-an:hover{filter:brightness(1.1);} .btn-an:disabled{opacity:.6;cursor:wait;}
  #map{position:relative;width:100%;height:calc(100% - 46px);}
  svg{width:100%;height:100%;display:block;}
  .wl{cursor:pointer;transition:filter .15s ease,stroke-width .15s ease;}
  .wl:hover{filter:brightness(1.12) saturate(1.08);stroke:#fff !important;stroke-width:2 !important;}
  .wl-label,.wl-sub{pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.42);stroke-linejoin:round;}
  .wl-label{fill:#fff;font-weight:700;letter-spacing:.1px;stroke-width:2px;}
  .wl-sub{fill:#f2f5fa;font-variant-numeric:tabular-nums;font-weight:600;stroke-width:1.6px;}
  .cl-box{fill:rgba(255,255,255,.012);stroke:var(--border);stroke-width:1.2;}
  .cl-bar{fill:rgba(255,255,255,.07);}
  .cl-label{pointer-events:none;fill:#eaf0f8;font-weight:800;font-size:12.5px;letter-spacing:.6px;}
  .cl-stat{pointer-events:none;fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;}
  .ns-box{fill:none;stroke:rgba(255,255,255,.13);stroke-width:1;}
  .ns-label{pointer-events:none;fill:#aab4c2;font-weight:700;font-size:11px;letter-spacing:.2px;}
  .ns-alert{pointer-events:none;fill:var(--red);font-weight:700;font-size:10px;}
  #tip{position:fixed;pointer-events:none;background:rgba(10,13,18,.9);backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,255,255,.1);padding:9px 12px;border-radius:10px;font-size:12px;display:none;max-width:300px;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.6);line-height:1.6;}
  #tip b{font-size:13px;font-weight:700;} #tip .k{color:var(--muted);font-size:11px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#2b333f;border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:#3a4453;}
  ::-webkit-scrollbar-track{background:transparent;}
  #err{position:absolute;inset:0;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}

  /* 드릴 패널 */
  #panel{position:fixed;top:0;right:0;width:min(560px,94vw);height:100%;background:var(--bar);border-left:1px solid var(--border);
    transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;z-index:50;box-shadow:-18px 0 50px rgba(0,0,0,.45);}
  #panel.open{transform:translateX(0);}
  .p-head{position:sticky;top:0;background:linear-gradient(180deg,#171d26,#141a22);padding:16px 20px;border-bottom:1px solid var(--border);z-index:1;}
  .p-head h2{margin:0;font-size:16px;font-weight:700;}
  .p-head .sub{color:var(--muted);font-size:12px;margin-top:3px;}
  .p-close{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--muted);font-size:21px;line-height:1;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
  .p-close:hover{background:#222b38;color:#fff;}
  .p-body{padding:4px 20px 28px;}
  .sec{margin-top:20px;}
  .sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 9px;display:flex;align-items:center;gap:8px;}
  .sec h3 .cnt{background:#222b38;color:#cdd6e2;border-radius:10px;padding:0 7px;font-size:10px;font-weight:700;}
  .row{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bar2);transition:border-color .12s;}
  .row:hover{border-color:#333c48;}
  .row .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .row .nm{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .kind{color:var(--muted);font-size:11px;}
  .row .val{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}
  .pill{font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;}
  .pill.red{background:rgba(214,69,61,.18);color:#ff8781;} .pill.amber{background:rgba(217,169,65,.18);color:#f2c34f;}
  .pill.green{background:rgba(47,158,68,.16);color:#5fd27f;} .pill.gray{background:#222b38;color:#9aa5b4;}
  .ok{color:var(--muted);font-size:12px;padding:6px 2px;}
  .incident{cursor:pointer;} .incident:hover{border-color:var(--accent);}
  .logs{background:#0a0d12;border:1px solid var(--border);border-radius:8px;padding:10px;max-height:300px;overflow:auto;
    font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all;}
  .logs .ln{color:#b8c2d0;padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03);}
  .logs .ln .app{color:var(--accent);} .logs .ln.err{color:#ff9d96;}
  .muted{color:var(--muted);}
</style>
</head>
<body>
<header>
  <h1>🗺️ AIOps</h1>
  <nav><a href="/ui/fleet.html" class="active">현황</a><a href="/ui/">인시던트</a></nav>
  <div class="ctrls">
    <div class="seg" id="cl-filter"><span class="lab">클러스터</span><button data-cl="*" class="on">전체</button></div>
    <div class="ms" id="ns-ms"><button id="ns-btn" type="button">전체 네임스페이스 ▾</button><div class="ms-menu" id="ns-menu"></div></div>
    <span class="sep"></span>
    <div class="seg"><span class="lab">색</span>
      <button data-color="cpu" class="on">CPU</button><button data-color="mem">메모리</button><button data-color="health">헬스</button></div>
    <div class="seg"><span class="lab">크기</span>
      <button data-size="replicas" class="on">replica</button><button data-size="cpu">CPU</button><button data-size="mem">메모리</button></div>
  </div>
  <div id="legend" class="legend"></div>
  <div id="meta">—</div>
  <a href="/logout" style="color:var(--muted);font-size:11px;text-decoration:none;padding:4px 8px;">로그아웃</a>
</header>
<div id="map"><svg id="svg" preserveAspectRatio="none"></svg><div id="err" style="display:flex"><div class="spinner"></div>상황판 로딩 중…</div></div>
<div id="tip"></div>

<div id="panel">
  <div class="p-head"><span class="p-close" onclick="closePanel()">×</span>
    <h2 id="p-title">—</h2><div class="sub" id="p-sub"></div></div>
  <div class="p-body" id="p-body"></div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const CL_HEAD=24, NS_HEAD=15, GAP=2;
const C_GREEN="#1a9850",C_AMBER="#f6a623",C_RED="#d73027",C_GRAY="#3a4049";

function wlColor(t){
  if(!t.desired) return C_GRAY;
  if(t.ready===0) return C_RED;
  if(t.ready<t.desired){                      // degraded — 부족분 많을수록 주황→빨강
    const f=(t.desired-t.ready)/t.desired;
    return `rgb(${lerp(246,215,f)},${lerp(166,48,f)},${lerp(35,39,f)})`;
  }
  return C_GREEN;
}
function wlStatus(t){
  if(!t.desired) return ["scaled 0","gray"];
  if(t.ready===0) return ["down","red"];
  if(t.ready<t.desired) return ["degraded","amber"];
  return ["healthy","green"];
}
function esc(s){return (s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

// ── 색/크기 모드 (finviz 맵뷰 전환) ──
let COLOR_MODE="cpu", SIZE_MODE="replicas", LAST=null, _maxCpu=0.001, _maxMem=1;
let CL_FILTER="*", NS_FILTER="*", _filterSig="";
// 애드온/플랫폼 ns (전체 보기일 때 블록 축소 → 서비스 강조)
const ADDON_NS=new Set(["kube-system","kube-public","kube-node-lease","monitoring","logging",
  "cert-manager","external-secrets","external-dns","keda","kyverno","argo-rollouts","argocd",
  "policy-reporter","aiops","gatekeeper-system","istio-system","ingress-nginx","velero","vault"]);
const ADDON_W=0.2;        // 애드온 블록 크기 배율(작게)
function nsMatch(t){return NS_FILTER==="*"||NS_FILTER.includes(t.namespace);}
function nsWeight(ns){return (NS_FILTER==="*" && ADDON_NS.has(ns)) ? ADDON_W : 1;}

// 나스닥 ticker 처럼 짧고 크게 — 클러스터 접미사 제거 + 공통 prefix 축약
function displayName(t){
  let n=t.name;
  n=n.replace(new RegExp("-?"+t.cluster.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"$"),"").replace("-"+t.cluster+"-","-");
  n=n.replace(/^kube-prometheus-stack-/,"kps-").replace(/^aws-load-balancer-controller/,"aws-lbc");
  return n||t.name;
}
function buildFilters(data){
  const clBox=document.getElementById("cl-filter");
  const clusters=(data.clusters||[]).map(c=>c.cluster);
  clBox.innerHTML='<span class="lab">클러스터</span><button data-cl="*">전체</button>'+clusters.map(c=>`<button data-cl="${c}">${c}</button>`).join("");
  clBox.querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b.dataset.cl===CL_FILTER);
    b.onclick=()=>{CL_FILTER=b.dataset.cl;NS_FILTER="*";_filterSig="";if(LAST){buildFilters(LAST);render(LAST);}};});

  const menu=document.getElementById("ns-menu"), btn=document.getElementById("ns-btn");
  const nss=[...new Set((data.tiles||[]).filter(t=>CL_FILTER==="*"||t.cluster===CL_FILTER).map(t=>t.namespace))].sort();
  const svc=nss.filter(n=>!ADDON_NS.has(n)), addon=nss.filter(n=>ADDON_NS.has(n));
  const sel=NS_FILTER==="*"?new Set():new Set(NS_FILTER);
  const box=(n)=>`<label><input type="checkbox" value="${n}" ${sel.has(n)?"checked":""}> ${n}</label>`;
  menu.innerHTML=`<label><input type="checkbox" value="*" ${NS_FILTER==="*"?"checked":""}> <b>전체</b></label>`+
    (svc.length?`<div class="grp">서비스</div>`+svc.map(box).join(""):"")+
    (addon.length?`<div class="grp">애드온/플랫폼</div>`+addon.map(box).join(""):"");
  btn.textContent=(NS_FILTER==="*"?"전체 네임스페이스":`${NS_FILTER.length}개 선택`)+" ▾";
  btn.onclick=(e)=>{e.stopPropagation();menu.classList.toggle("open");};
  menu.onclick=(e)=>e.stopPropagation();
  menu.querySelectorAll("input").forEach(cb=>cb.onchange=()=>{
    const allCb=menu.querySelector('input[value="*"]');
    if(cb.value==="*"&&cb.checked){menu.querySelectorAll('input').forEach(x=>{if(x.value!=="*")x.checked=false;});NS_FILTER="*";}
    else{allCb.checked=false;
      const ck=[...menu.querySelectorAll("input")].filter(x=>x.value!=="*"&&x.checked).map(x=>x.value);
      NS_FILTER=ck.length?ck:"*"; if(NS_FILTER==="*")allCb.checked=true;}
    btn.textContent=(NS_FILTER==="*"?"전체 네임스페이스":`${NS_FILTER.length}개 선택`)+" ▾";
    render(LAST);
  });
}
function lerp(a,b,t){return Math.round(a+(b-a)*t);}
// ColorBrewer RdYlGn(reversed) — 저사용 초록 → 고사용 빨강. finviz 급 부드러운 다단계.
// 다크 배경 튜닝 — 창백한 노랑(#ffffbf) 제거, 중간=골드, 빨강 3단계(주황→벽돌→옥스블러드)
const _HEAT=[[33,145,80],[78,169,74],[132,184,70],[190,172,60],[224,163,54],
             [223,122,48],[211,80,46],[187,48,45],[146,32,37]];
function heat(v){
  const t=Math.max(0,Math.min(1,Math.pow(v,0.80)));   // 평상시 초록, 핫만 빨강
  const g=t*(_HEAT.length-1),i=Math.min(_HEAT.length-2,Math.floor(g)),f=g-i,a=_HEAT[i],b=_HEAT[i+1];
  return `rgb(${lerp(a[0],b[0],f)},${lerp(a[1],b[1],f)},${lerp(a[2],b[2],f)})`;
}
function tileFill(t){
  if(COLOR_MODE==="health") return wlColor(t);
  if(COLOR_MODE==="cpu") return (t.cpu>0)?heat(t.cpu/_maxCpu):C_GRAY;
  if(COLOR_MODE==="mem") return (t.mem>0)?heat(t.mem/_maxMem):C_GRAY;
  return C_GRAY;
}
function tileSize(t){
  if(SIZE_MODE==="cpu") return Math.max(0.002,t.cpu||0);
  if(SIZE_MODE==="mem") return Math.max(1,t.mem||0);
  return Math.max(1,t.desired||0);
}
function unhealthy(t){return t.desired>0 && t.ready<t.desired;}
function fmtCpu(c){return c>=1?c.toFixed(2)+" core":Math.round(c*1000)+" m";}
function fmtMem(b){return b>=1073741824?(b/1073741824).toFixed(1)+" Gi":Math.round(b/1048576)+" Mi";}
function updateLegend(){
  const L=document.getElementById("legend");
  if(COLOR_MODE==="health"){
    L.innerHTML=`<span><i style="background:${C_GREEN}"></i>정상</span><span><i style="background:${C_AMBER}"></i>degraded</span>`+
      `<span><i style="background:${C_RED}"></i>down</span><span><i style="background:${C_GRAY}"></i>scaled 0</span>`;
  }else{
    const lo=heat(0),mid=heat(.5),hi=heat(1);
    L.innerHTML=`<span class="muted">${COLOR_MODE==="cpu"?"CPU":"Mem"} 사용량</span>`+
      `<span style="display:inline-block;width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,${lo},${mid},${hi});box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></span>`+
      `<span class="muted">낮음→높음</span><span><i style="background:${C_RED};border:1px solid #fff"></i>장애=흰테두리</span>`;
  }
}

// squarified treemap
function squarify(items,x,y,w,h){
  const out=[];const total=items.reduce((s,i)=>s+i.value,0)||1;let a={x,y,w,h};
  let rem=items.map(i=>({...i,area:i.value/total*(w*h)}));
  const worst=(r,l)=>{const s=r.reduce((p,b)=>p+b.area,0),mx=Math.max(...r.map(b=>b.area)),mn=Math.min(...r.map(b=>b.area));return Math.max(l*l*mx/(s*s),s*s/(l*l*mn));};
  function lay(r,hor){const s=r.reduce((p,b)=>p+b.area,0);
    if(hor){const rh=s/a.w;let cx=a.x;for(const b of r){const bw=b.area/rh;out.push({x:cx,y:a.y,w:bw,h:rh,data:b.data});cx+=bw;}a={x:a.x,y:a.y+rh,w:a.w,h:a.h-rh};}
    else{const rw=s/a.h;let cy=a.y;for(const b of r){const bh=b.area/rw;out.push({x:a.x,y:cy,w:rw,h:bh,data:b.data});cy+=bh;}a={x:a.x+rw,y:a.y,w:a.w,h:a.h};}}
  let row=[];
  while(rem.length){const hor=a.w>=a.h,l=hor?a.w:a.h,nx=rem[0];
    if(!row.length||worst(row,l)>=worst([...row,nx],l)){row.push(nx);rem.shift();}else{lay(row,hor);row=[];}}
  if(row.length)lay(row,a.w>=a.h);
  return out;
}

function rect(cls,x,y,w,h,fill,rx){const r=document.createElementNS(NS,"rect");r.setAttribute("class",cls);
  r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",Math.max(0,w));r.setAttribute("height",Math.max(0,h));
  if(fill)r.setAttribute("fill",fill);if(rx)r.setAttribute("rx",rx);return r;}
function text(cls,x,y,s,size){const t=document.createElementNS(NS,"text");t.setAttribute("class",cls);
  t.setAttribute("x",x);t.setAttribute("y",y);if(size)t.setAttribute("font-size",size);t.textContent=s;return t;}

const tip=document.getElementById("tip");
function showTip(e,t){const[st,cc]=wlStatus(t);
  tip.style.display="block";tip.style.left=Math.min(e.clientX+14,innerWidth-310)+"px";tip.style.top=(e.clientY+14)+"px";
  tip.innerHTML=`<b>${esc(t.name)}</b> <span class="k">${t.kind}</span><br>`+
    `<span class="k">${esc(t.cluster)} / ${esc(t.namespace)}</span><br>`+
    `replica <b>${t.ready}/${t.desired}</b> · <span style="color:${wlColor(t)}">${st}</span><br>`+
    `CPU <b>${fmtCpu(t.cpu||0)}</b> · Mem <b>${fmtMem(t.mem||0)}</b><br>`+
    `<span class="k">클릭 → 네임스페이스 상세·로그</span>`;}

let SVG,W,H;
function render(data){
  SVG=document.getElementById("svg");const err=document.getElementById("err");SVG.innerHTML="";
  if(data.error){err.style.display="flex";err.textContent="데이터 소스 오류: "+data.error;return;}
  err.style.display="none";
  const alltiles=data.tiles||[];const alerts=data.ns_alerts||{};
  LAST=data;
  const sig=(data.clusters||[]).map(c=>c.cluster).join(",");
  if(sig!==_filterSig){_filterSig=sig;buildFilters(data);}
  const tiles=alltiles.filter(t=>(CL_FILTER==="*"||t.cluster===CL_FILTER)&&nsMatch(t));
  _maxCpu=Math.max(0.001,...tiles.map(t=>t.cpu||0));
  _maxMem=Math.max(1,...tiles.map(t=>t.mem||0));
  updateLegend();
  const r=SVG.getBoundingClientRect();W=r.width;H=r.height;SVG.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const scope=(CL_FILTER==="*"?"전체":CL_FILTER)+(NS_FILTER==="*"?"":" / "+(Array.isArray(NS_FILTER)?(NS_FILTER.length>2?NS_FILTER.length+"개 ns":NS_FILTER.join("+")):NS_FILTER));
  document.getElementById("meta").textContent=`${scope} · 워크로드 ${tiles.length} · ${new Date().toLocaleTimeString()}`;
  if(!tiles.length){err.style.display="flex";err.textContent="표시할 워크로드 없음";return;}
  const byCl={};
  for(const t of tiles){(byCl[t.cluster]=byCl[t.cluster]||{});(byCl[t.cluster][t.namespace]=byCl[t.cluster][t.namespace]||[]).push(t);}
  const sz=t=>tileSize(t)*nsWeight(t.namespace);   // 전체 보기 시 애드온 축소·서비스 강조
  const clItems=Object.entries(byCl).map(([c,nss])=>({value:Object.values(nss).flat().reduce((s,t)=>s+sz(t),0),data:{c,nss}}))
    .sort((a,b)=>b.value-a.value);

  for(const cr of squarify(clItems,GAP,GAP,W-2*GAP,H-2*GAP)){
    const{c,nss}=cr.data;
    SVG.appendChild(rect("cl-box",cr.x,cr.y,cr.w,cr.h,null,6));
    SVG.appendChild(rect("cl-bar",cr.x+1,cr.y+1,cr.w-2,CL_HEAD-3,null,5));
    const wls=Object.values(nss).flat();
    SVG.appendChild(text("cl-label",cr.x+11,cr.y+17,c.toUpperCase()));
    const stat=`${Object.keys(nss).length} ns · ${wls.length} workloads`;
    SVG.appendChild(text("cl-stat",cr.x+cr.w-11,cr.y+17,stat).also(t=>t.setAttribute("text-anchor","end")));
    const ix=cr.x+GAP,iy=cr.y+CL_HEAD,iw=cr.w-2*GAP,ih=cr.h-CL_HEAD-GAP;
    if(iw<=2||ih<=2)continue;
    const nsItems=Object.entries(nss).map(([n,ws])=>({value:ws.reduce((s,t)=>s+sz(t),0),data:{n,ws}})).sort((a,b)=>b.value-a.value);
    for(const nr of squarify(nsItems,ix,iy,iw,ih)){
      const{n,ws}=nr.data;
      SVG.appendChild(rect("ns-box",nr.x,nr.y,nr.w,nr.h,null,4));
      const al=alerts[`${c}/${n}`]||0;
      if(nr.w>50&&nr.h>NS_HEAD+6){
        SVG.appendChild(text("ns-label",nr.x+6,nr.y+11,n.length*6.2>nr.w-24?n.slice(0,Math.max(3,(nr.w-24)/6.2|0)):n));
        if(al)SVG.appendChild(text("ns-alert",nr.x+nr.w-6,nr.y+11,"● "+al).also(t=>t.setAttribute("text-anchor","end")));
      }
      const wx=nr.x+1,wy=nr.y+(nr.w>50&&nr.h>NS_HEAD+6?NS_HEAD:1),ww=nr.w-2,wh=nr.h-(nr.w>50&&nr.h>NS_HEAD+6?NS_HEAD+1:2);
      if(ww<=1||wh<=1)continue;
      const wlItems=ws.map(t=>({value:sz(t),data:t})).sort((a,b)=>b.value-a.value);
      for(const w of squarify(wlItems,wx,wy,ww,wh)){
        const t=w.data;const g=document.createElementNS(NS,"g");const uh=unhealthy(t);
        g.appendChild(rect("wl",w.x+.4,w.y+.4,w.w-.8,w.h-.8,tileFill(t),1.5).also(r=>{
          r.setAttribute("stroke",uh?"#ffffff":"rgba(0,0,0,.28)");r.setAttribute("stroke-width",uh?1.8:.6);}));
        if(w.w>30&&w.h>18){
          const dn=displayName(t);
          let fs=Math.min(w.w/(Math.max(4,dn.length)*0.60), w.h*0.44);
          fs=Math.max(11,Math.min(30,fs));              // 나스닥 ticker 느낌 — 타일 클수록 큼
          const nm=dn.length*fs*.6>w.w-8?dn.slice(0,Math.max(2,((w.w-8)/(fs*.6))|0))+"…":dn;
          const cx=w.x+w.w/2, hasSub=w.h>46;
          g.appendChild(text("wl-label",cx,w.y+w.h/2+(hasSub?-2:fs*0.34),nm,fs).also(e=>e.setAttribute("text-anchor","middle")));
          if(hasSub)g.appendChild(text("wl-sub",cx,w.y+w.h/2+fs*0.82,`${t.ready}/${t.desired}`,Math.max(10,fs*0.48)).also(e=>e.setAttribute("text-anchor","middle")));
        }
        g.addEventListener("mousemove",e=>showTip(e,t));
        g.addEventListener("mouseleave",()=>tip.style.display="none");
        g.addEventListener("click",()=>openPanel(t.cluster,t.namespace,t.name));
        SVG.appendChild(g);
      }
    }
  }
}
// tiny helper: chainable attr set
Element.prototype.also=function(fn){fn(this);return this;};

// ───────── 드릴 패널 ─────────
async function openPanel(cluster,ns,focus){
  const P=document.getElementById("panel");P.classList.add("open");
  document.getElementById("p-title").textContent=`${cluster} / ${ns}`;
  document.getElementById("p-sub").textContent="불러오는 중…";
  location.hash=`ns=${cluster}/${ns}`;
  const body=document.getElementById("p-body");body.innerHTML="";
  let d;try{d=await(await fetch(`/api/fleet/${encodeURIComponent(cluster)}/${encodeURIComponent(ns)}`)).json();}
  catch(e){body.innerHTML='<div class="ok">불러오기 실패</div>';return;}
  const wl=d.workloads||[],pp=d.problem_pods||[],fa=d.firing_alerts||[],inc=d.incidents||[],lg=(d.logs&&d.logs.lines)||[];
  const bad=wl.filter(w=>!w.healthy).length;
  document.getElementById("p-sub").innerHTML=`워크로드 ${wl.length} · 문제 ${bad} · 알림 ${fa.length} · 인시던트 ${inc.length}`;

  let h=`<button class="btn-an" id="an-btn" onclick="runAnalyze('${cluster}','${ns}')">⚡ 이 네임스페이스 지금 분석 (Bedrock)</button><div id="an-result"></div>`;
  // 워크로드
  h+=sec("워크로드",wl.length,wl.map(w=>{
    const[st,cc]=wlStatus(w);
    return `<div class="row"><span class="dot" style="background:${colorOf(cc)}"></span>
      <span class="nm">${esc(w.name)}</span><span class="kind">${w.kind}</span>
      <span class="val">${w.ready}/${w.desired}</span><span class="pill ${cc}">${st}</span></div>`;}).join("")||okmsg("모든 워크로드 정상"));
  // 문제 파드
  if(pp.length)h+=sec("문제 파드",pp.length,pp.map(p=>{
    const st=!p.ready?["not-ready","red"]:(p.recent_restarts?["restarting","amber"]:["ok","green"]);
    const rs=p.recent_restarts?`<span class="val">↻${p.recent_restarts} (15m)</span>`:(p.restarts?`<span class="val muted">↻${p.restarts} 누적</span>`:"");
    return `<div class="row"><span class="dot" style="background:${colorOf(st[1])}"></span>
     <span class="nm">${esc(p.pod)}</span>
     ${p.last_reason?`<span class="pill ${p.recent_restarts?'red':'gray'}">${esc(p.last_reason)}</span>`:""}
     ${rs}<span class="pill ${st[1]}">${st[0]}</span></div>`;}).join(""));
  // 파드 (Phase D)
  const pods=d.pods||[];
  if(pods.length)h+=sec("파드",pods.length,`<div style="max-height:260px;overflow:auto">`+pods.map(p=>
    `<div class="row"><span class="dot" style="background:${p.ready?C_GREEN:(p.phase==='Running'?C_AMBER:C_RED)}"></span>
     <span class="nm">${esc(p.pod)}</span>
     ${p.restarts?`<span class="val">↻${p.restarts}</span>`:""}
     <span class="val">${fmtCpu(p.cpu||0)}</span><span class="val">${fmtMem(p.mem||0)}</span>
     <span class="pill ${p.ready?'green':'amber'}">${esc(p.phase)}</span></div>`).join("")+`</div>`);
  // 발화 알림
  if(fa.length)h+=sec("발화 알림",fa.length,fa.map(a=>
    `<div class="row"><span class="dot" style="background:${a.severity==='critical'?colorOf('red'):colorOf('amber')}"></span>
     <span class="nm">${esc(a.alertname)}</span><span class="pill ${a.severity==='critical'?'red':'amber'}">${a.severity}</span></div>`).join(""));
  // AIOps 인시던트
  if(inc.length)h+=sec("AIOps 인시던트",inc.length,inc.map(i=>
    `<div class="row incident" onclick="location.href='/ui/#inc=${encodeURIComponent(i.id)}'">
     <span class="dot" style="background:${i.severity==='critical'?colorOf('red'):colorOf('amber')}"></span>
     <span class="nm">${esc(i.id)}</span>
     ${i.confidence?`<span class="pill gray">conf ${i.confidence}</span>`:""}
     <span class="pill ${i.severity==='critical'?'red':'amber'}">${i.severity}</span>
     <span class="val">RCA →</span></div>`).join(""));
  // 로그
  const logErr=d.logs&&d.logs._unavailable;
  h+=`<div class="sec"><h3>최근 로그 <span class="cnt">${lg.length}</span></h3>`;
  if(logErr)h+=`<div class="ok">로그 소스 불가: ${esc(logErr)}</div>`;
  else if(!lg.length)h+=okmsg("최근 로그 없음");
  else h+=`<div class="logs">`+lg.map(l=>{
    const isErr=/(?:err|error|exception|fatal|panic|fail)/i.test(l.line);
    return `<div class="ln${isErr?' err':''}"><span class="app">${esc(l.app)}</span> ${esc(l.line)}</div>`;}).join("")+`</div>`;
  h+=`</div>`;
  body.innerHTML=h;
}
function sec(title,cnt,inner){return `<div class="sec"><h3>${title} <span class="cnt">${cnt}</span></h3>${inner}</div>`;}
function okmsg(m){return `<div class="ok">✓ ${m}</div>`;}
function colorOf(c){return {red:C_RED,amber:C_AMBER,green:C_GREEN,gray:C_GRAY}[c]||C_GRAY;}
function closePanel(){document.getElementById("panel").classList.remove("open");history.replaceState(null,"",location.pathname);}
function fromHash(){const m=location.hash.match(/ns=([^/]+)\/(.+)/);if(m)openPanel(decodeURIComponent(m[1]),decodeURIComponent(m[2]));}

function cf(c){return c==="high"?"green":c==="medium"?"amber":"red";}
async function runAnalyze(cluster,ns){
  const btn=document.getElementById("an-btn"),res=document.getElementById("an-result");
  btn.disabled=true;btn.textContent="⏳ Bedrock 분석 중… (최대 ~20s)";
  try{
    const d=await(await fetch(`/api/analyze/${encodeURIComponent(cluster)}/${encodeURIComponent(ns)}`,{method:"POST"})).json();
    const r=d.report||{};
    res.innerHTML=`<div style="border:1px solid var(--accent);border-radius:10px;padding:13px 14px;margin-top:10px;background:rgba(76,141,255,.06)">
      <div style="font-weight:700;margin-bottom:6px">⚡ 온디맨드 RCA <span class="pill ${cf(r.overall_confidence)}">conf ${r.overall_confidence||'?'}</span></div>
      <div>${esc(r.summary||'')}</div>`+
      (r.root_cause_hypotheses||[]).map(h=>`<div class="row" style="margin-top:8px"><span class="nm">${esc(h.cause)}</span><span class="pill ${cf(h.confidence)}">${h.confidence}</span></div>`).join("")+
      ((r.suggested_actions||[]).length?`<div style="margin-top:8px"><span class="muted">제안</span><ul style="margin:4px 0 0;padding-left:18px">`+r.suggested_actions.map(a=>`<li>${esc(a)}</li>`).join("")+`</ul></div>`:"")+
      `<div class="muted" style="margin-top:7px">→ Slack #test 발송 · 인시던트 ${esc(d.incident_id||'')}</div></div>`;
  }catch(e){res.innerHTML=`<div class="ok">분석 실패 — 로그 확인</div>`;}
  btn.disabled=false;btn.textContent="⚡ 다시 분석";
}

// 색/크기 토글
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{
  COLOR_MODE=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('on',x===b));if(LAST)render(LAST);});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{
  SIZE_MODE=b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('on',x===b));if(LAST)render(LAST);});

document.addEventListener("click",()=>document.getElementById("ns-menu")?.classList.remove("open"));

async function tick(){try{render(await(await fetch("/api/fleet")).json());}catch(e){}}
tick().then(fromHash);
setInterval(tick,8000);
addEventListener("resize",tick);
</script>
